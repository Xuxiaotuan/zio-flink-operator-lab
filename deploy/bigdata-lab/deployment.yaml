apiVersion: apps/v1
kind: Deployment
metadata:
  name: zio-flink-operator
  namespace: bigdata-lab
  labels:
    app.kubernetes.io/name: zio-flink-operator
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zio-flink-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zio-flink-operator
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: zio-flink-operator
      imagePullSecrets:
        - name: xxt-harbor-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zio-flink-operator
      containers:
        - name: api
          image: 100.97.53.78:5001/xxt/zio-flink-operator-lab:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FLINK_NAMESPACE
              value: bigdata-lab
            - name: FLINK_OPERATOR_GROUP
              value: flink.apache.org
            - name: FLINK_OPERATOR_VERSION
              value: v1beta1
            - name: FLINK_OPERATOR_FIELD_MANAGER
              value: zio-flink-operator-lab
            - name: FLINK_OPERATOR_MAX_RETRIES
              value: "3"
            - name: FLINK_SAVEPOINT_DIRECTORY
              value: s3://flink-savepoints/zio-flink-operator/bigdata-lab/
            - name: ZIO_FLINK_STATE_BACKEND
              value: kubernetes
            - name: ZIO_FLINK_OPERATION_STORE
              value: kubernetes
            - name: ZIO_FLINK_METADATA_JDBC_URL
              value: jdbc:postgresql://100.82.226.63:30660/xxt
            - name: ZIO_FLINK_METADATA_USER
              valueFrom:
                secretKeyRef:
                  name: zio-flink-postgres
                  key: username
            - name: ZIO_FLINK_METADATA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zio-flink-postgres
                  key: password
            - name: ZIO_FLINK_STATE_POLL_INTERVAL_SECONDS
              value: "15"
            - name: ZIO_FLINK_SERVER_HOST
              value: 0.0.0.0
            - name: ZIO_FLINK_SERVER_PORT
              value: "8080"
            - name: ZIO_FLINK_SERVER_THREADS
              value: "8"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: zio-flink-operator
